services:
  - type: web
    name: ailu-y-tomy
    runtime: docker
    plan: free
    region: virginia
    numInstances: 1
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: TRUST_PROXY
        value: "1"
      - key: APP_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_CA
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: rincon-render
